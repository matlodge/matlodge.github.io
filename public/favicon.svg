<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="512"
   height="512"
   viewBox="0 0 512 512"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bond {
        stroke: #8B5CF6;
        stroke-width: 20;
        stroke-linecap: round;
        fill: none;
      }

      .atom-am {
        fill: #6D28D9;
        stroke: #DDD6FE;
        stroke-width: 7;
      }

      .crystal {
        stroke: #0D9488;
        stroke-width: 20;
        fill: none;
        stroke-linejoin: round;
      }

      .crystal-back {
        stroke: #5EEAD4;
      }

      .atom-cr {
        fill: #0D9488;
        stroke: #99F6E4;
        stroke-width: 7;
      }

      .atom-cr-back {
        fill: #5EEAD4;
        stroke: #CCFBF1;
      }

      .wave {
        stroke: #0284C7;
        stroke-width: 24;
        fill: none;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <rect
     x="16"
     y="16"
     width="480"
     height="480"
     rx="88"
     fill="#F8FAFC"
     stroke="#0F172A"
     stroke-width="20" />

  <!-- Optical wave shared by both phases -->
  <path
     d="M 38,402 C 88,360 138,360 188,402 S 288,444 338,402 S 438,360 474,402"
     class="wave" />

  <!-- Amorphous phase: disordered atoms and bonds -->
  <g class="bond">
    <line x1="100" y1="152" x2="176" y2="112" />
    <line x1="176" y1="112" x2="226" y2="182" />
    <line x1="100" y1="152" x2="66" y2="224" />
    <line x1="100" y1="152" x2="120" y2="252" />
    <line x1="66" y1="224" x2="120" y2="252" />
    <line x1="120" y1="252" x2="210" y2="278" />
    <line x1="226" y1="182" x2="210" y2="278" />
  </g>
  <g class="atom-am">
    <circle cx="100" cy="152" r="29" />
    <circle cx="176" cy="112" r="24" />
    <circle cx="226" cy="182" r="26" />
    <circle cx="66" cy="224" r="20" />
    <circle cx="120" cy="252" r="30" />
    <circle cx="210" cy="278" r="23" />
  </g>

  <!-- Crystalline phase: ordered unit cell -->
  <g class="crystal">
    <rect x="280" y="174" width="136" height="136" />
    <rect x="326" y="128" width="136" height="136" class="crystal crystal-back" />
    <line x1="280" y1="174" x2="326" y2="128" />
    <line x1="416" y1="174" x2="462" y2="128" />
    <line x1="416" y1="310" x2="462" y2="264" />
    <line x1="280" y1="310" x2="326" y2="264" />
  </g>
  <g class="atom-cr">
    <circle cx="280" cy="174" r="19" />
    <circle cx="416" cy="174" r="19" />
    <circle cx="416" cy="310" r="19" />
    <circle cx="280" cy="310" r="19" />
    <circle cx="326" cy="128" r="19" class="atom-cr atom-cr-back" />
    <circle cx="462" cy="128" r="19" class="atom-cr atom-cr-back" />
    <circle cx="462" cy="264" r="19" class="atom-cr atom-cr-back" />
    <circle cx="326" cy="264" r="19" class="atom-cr atom-cr-back" />
  </g>
</svg>
